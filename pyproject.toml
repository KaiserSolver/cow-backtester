[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cow-backtester"
description = "Offline backtester, A/B harness, and counterfactual scorecard for CoW Protocol solvers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "kaisersolver" }]
dependencies = ["eth_abi>=5,<6"]
dynamic = ["version"]
keywords = ["cow-protocol", "solver", "backtesting", "mev", "defi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/kaisersolver/cow-backtester"
Issues = "https://github.com/kaisersolver/cow-backtester/issues"
Changelog = "https://github.com/kaisersolver/cow-backtester/blob/main/CHANGELOG.md"

[project.scripts]
cow-backtester = "cow_backtester.backtest:cli"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
packages = ["cow_backtester"]

[tool.setuptools.dynamic]
version = { attr = "cow_backtester._version.VERSION" }

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long doc/print lines are deliberate in scorecard output

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
